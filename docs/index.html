*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:12px/1.4 "Space Mono",monospace;background:var(--bg);color:var(--tx);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;user-select:none}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--ln)}
header b{font-weight:400;color:var(--ac);margin-right:8px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
button,select,input[type=number]{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--ln);padding:4px 9px;cursor:pointer;border-radius:2px}
button:hover,select:hover{border-color:var(--ac);color:var(--ac)}
button.p,button.on{background:var(--ac);color:var(--ak);border-color:var(--ac)}button.p:hover,button.on:hover{color:var(--ak);opacity:.85}
input[type=number]{width:64px;cursor:text}
.sp{flex:1}
option{background:var(--pn);color:var(--tx)}select{max-width:140px}
.tl{display:none;gap:8px;margin-right:8px;align-items:center}
.app .tl{display:flex}.app header{-webkit-app-region:drag}
.app header button,.app header input,.app header select,.app header #mt,.app .tl{-webkit-app-region:no-drag}
.tl i{width:12px;height:12px;border-radius:50%;display:grid;place-items:center;font:700 10px/1 sans-serif;font-style:normal;color:transparent;cursor:default;border:1px solid rgba(0,0,0,.2)}
.tl:hover i{color:rgba(0,0,0,.65)}.tl i:active{filter:brightness(.8)}
.tl .c{background:#ff5f57}.tl .m{background:#febc2e}.tl .x{background:#28c840}
.lg{display:inline-block;width:24px;height:24px;background:var(--ac);-webkit-mask:var(--lg) center/contain no-repeat;mask:var(--lg) center/contain no-repeat}
main{display:grid;grid-template-columns:1fr 300px;min-height:0}
#ws{padding:12px;overflow:auto;min-height:0;background:var(--cv);display:grid;gap:12px;align-content:start}
h6{font-weight:400;color:var(--ac);text-transform:uppercase;letter-spacing:1px;font-size:11px;margin-bottom:6px}
.row{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;margin-bottom:4px}
.nm{text-align:left}.nm.mt{opacity:.4;text-decoration:line-through}
.st{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.s{height:26px;border:1px solid var(--ln);border-radius:2px;background:var(--pn);cursor:pointer}
.s.a{background:var(--bg)}.s:hover{border-color:var(--ac)}
.s.on{background:var(--ac);border-color:var(--ac)}.s.cur{outline:2px solid var(--tx);outline-offset:-2px}
#pr{width:100%;display:block;border:1px solid var(--ln);cursor:crosshair;touch-action:none}
aside{background:var(--pn);border-left:1px solid var(--ln);overflow:auto;min-height:0}
details{border-bottom:1px solid var(--ln)}summary{padding:8px 10px;cursor:pointer;color:var(--ac);text-transform:uppercase;letter-spacing:1px;font-size:11px}
.in{padding:2px 10px 10px;display:grid;gap:7px}
.mx{display:grid;grid-template-columns:50px 1fr 1fr;gap:6px;align-items:center;color:var(--mu)}
input[type=range]{width:100%;accent-color:var(--ac);height:16px}
#mt{width:80px;height:8px;border:1px solid var(--ln)}#mt i{display:block;height:100%;width:0;background:var(--ac)}
footer{padding:4px 10px;background:var(--pn);border-top:1px solid var(--ln);color:var(--mu);display:flex;justify-content:space-between;gap:10px}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:60vh 1fr}aside{border-left:0;border-top:1px solid var(--ln)}}

<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s),CH=["Kick","Snare","Clap","Hat","Bass","Lead"],NW=16,LO=48,HI=72,CW=40,RH=14;
const mk=()=>({s:[0,1,2,3,4].map(()=>Array(NW).fill(0)),n:[]});
let S={bpm:120,mode:"pat",cur:0,pats:[mk(),mk(),mk(),mk()],song:[0,-1,-1,-1,-1,-1,-1,-1],mix:CH.map(()=>({v:.8,p:0,m:0})),mv:.8};
[0,4,8,12].forEach(i=>S.pats[0].s[0][i]=1);[4,12].forEach(i=>S.pats[0].s[1][i]=1);[2,6,10,14].forEach(i=>S.pats[0].s[3][i]=1);[0,3,6,10].forEach(i=>S.pats[0].s[4][i]=1);
S.pats[0].n=[{s:0,l:2,k:60},{s:4,l:2,k:63},{s:8,l:2,k:67},{s:12,l:4,k:65}];
const st=m=>{$("#s").textContent=m};
/* ---- ses motoru ---- */
let ctx,mst,an,bus,nb,playing=false,step=0,next=0,slot=7,pp=0,cs=-1,timer=0,q=[];
const wk=(()=>{try{const w=new Worker(URL.createObjectURL(new Blob(["let i=0;onmessage=e=>{clearInterval(i);if(e.data)i=setInterval(()=>postMessage(0),25)}"])));w.onmessage=()=>sched();return w}catch(e){return null}})();
function ensure(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;ctx=new C({latencyHint:"interactive"});graph()}
if(ctx.state!=="running")ctx.resume().catch(()=>{})}
function graph(){mst=ctx.createGain();an=ctx.createAnalyser();an.fftSize=256;mst.connect(an);an.connect(ctx.destination);
bus=CH.map(()=>{const g=ctx.createGain(),p=ctx.createStereoPanner();g.connect(p);p.connect(mst);return{g,p}});
nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;applyMix()}
function applyMix(){if(!ctx)return;bus.forEach((b,i)=>{b.g.gain.value=S.mix[i].m?0:S.mix[i].v;b.p.pan.value=S.mix[i].p});mst.gain.value=S.mv}
function nz(t,d,type,f,v,o){const s=ctx.createBufferSource();s.buffer=nb;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(o);s.start(t);s.stop(t+d+.02)}
function osc(t,d,type,f0,f1,v,o,cut){const x=ctx.createOscillator(),g=ctx.createGain();x.type=type;x.frequency.setValueAtTime(f0,t);if(f1)x.frequency.exponentialRampToValueAtTime(f1,t+d*.4);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);let n=x;if(cut){const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=cut;x.connect(f);n=f}n.connect(g).connect(o);x.start(t);x.stop(t+d+.02)}
const V=[(t,o)=>osc(t,.4,"sine",150,45,1,o),(t,o)=>{nz(t,.2,"highpass",1200,.8,o);osc(t,.1,"triangle",190,120,.6,o)},
(t,o)=>{[0,.012,.024].forEach(d=>nz(t+d,.03,"bandpass",1500,.7,o));nz(t+.036,.18,"bandpass",1400,.6,o)},(t,o)=>nz(t,.06,"highpass",7500,.5,o),(t,o)=>osc(t,.28,"sawtooth",55,0,.7,o,500)];
const lead=(k,t,d)=>osc(t,Math.max(.12,d),"square",440*2**((k-69)/12),0,.18,bus[5].g,3000);
function nextSlot(){for(let i=1;i<=8;i++){const j=(slot+i)%8;if(S.song[j]>=0){slot=j;return S.song[j]}}return S.cur}
function sched(){if(!playing)return;const sd=60/S.bpm/4;
while(next<ctx.currentTime+.12){if(step===0)pp=S.mode==="song"?nextSlot():S.cur;const P=S.pats[pp];
for(let i=0;i<5;i++)if(P.s[i][step]&&!S.mix[i].m)V[i](next,bus[i].g);
if(!S.mix[5].m)P.n.forEach(n=>{if(n.s===step)lead(n.k,next,n.l*sd)});
q.push({t:next,s:step,p:pp});if(q.length>64)q.shift();next+=sd;step=(step+1)%NW}
if(!wk)timer=setTimeout(sched,25)}
function play(){ensure();if(playing)return;playing=true;step=0;slot=7;next=ctx.currentTime+.06;q=[];wk&&wk.postMessage(1);sched();upl();st(t("playing"))}
function stop(){playing=false;clearTimeout(timer);wk&&wk.postMessage(0);q=[];cs=-1;hl();drawPR();upl();st(t("stopped"))}
const toggle=()=>playing?stop():play();
/* ---- arayüz ---- */
function hl(){document.querySelectorAll(".s").forEach(e=>e.classList.toggle("cur",+e.dataset.j===cs))}
function rack(){const P=S.pats[S.cur];$("#rk").innerHTML=CH.map((n,i)=>`<div class="row"><button class="nm${S.mix[i].m?" mt":""}" data-c="${i}">${n}</button><div class="st">${Array.from({length:NW},(_,j)=>`<i class="s${(i<5?P.s[i][j]:P.n.some(x=>x.s===j))?" on":""}${j%8<4?" a":""}" data-c="${i}" data-j="${j}"></i>`).join("")}</div></div>`).join("");hl()}
$("#rk").onclick=e=>{const c=e.target.dataset.c;if(c===undefined)return;const i=+c;
if(e.target.classList.contains("nm")){snap();S.mix[i].m^=1;applyMix();rack();return}
if(i>4)return;snap();const j=+e.target.dataset.j,a=S.pats[S.cur].s[i];a[j]^=1;if(a[j]){ensure();V[i](ctx.currentTime,bus[i].g)}rack()};
const pr=$("#pr"),px=pr.getContext("2d");pr.width=NW*CW;pr.height=(HI-LO+1)*RH;
function drawPR(){const c=getComputedStyle(document.documentElement),v=n=>c.getPropertyValue(n).trim(),W=pr.width,H=pr.height;
px.fillStyle=v("--cv");px.fillRect(0,0,W,H);
for(let k=HI;k>=LO;k--){const y=(HI-k)*RH;if([1,3,6,8,10].includes(k%12)){px.fillStyle=v("--pn");px.fillRect(0,y,W,RH)}px.fillStyle=v("--ln");px.fillRect(0,y,W,1)}
for(let i=0;i<=NW;i++){px.fillStyle=i%4?v("--ln"):v("--mu");px.fillRect(i*CW,0,1,H)}
px.fillStyle=v("--ac");S.pats[S.cur].n.forEach(n=>px.fillRect(n.s*CW+1,(HI-n.k)*RH+1,n.l*CW-2,RH-2));
if(cs>=0&&pp===S.cur){px.globalAlpha=.18;px.fillRect(cs*CW,0,CW,H);px.globalAlpha=1}}
let drag=null;
const cell=e=>{const r=pr.getBoundingClientRect();return{x:Math.min(NW-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*NW))),k:HI-Math.min(HI-LO,Math.max(0,Math.floor((e.clientY-r.top)/r.height*(HI-LO+1))))}};
pr.onpointerdown=e=>{snap();const{x,k}=cell(e),N=S.pats[S.cur].n,i=N.findIndex(n=>n.k===k&&x>=n.s&&x<n.s+n.l);
if(i>=0)N.splice(i,1);else{const n={s:x,l:1,k};N.push(n);drag=n;pr.setPointerCapture(e.pointerId);ensure();lead(k,ctx.currentTime,.25)}drawPR();rack()};
pr.onpointermove=e=>{if(drag){drag.l=Math.max(1,cell(e).x-drag.s+1);drawPR()}};
pr.onpointerup=pr.onpointercancel=()=>{drag=null};
function build(){$("#pb").innerHTML=[0,1,2,3].map(i=>`<button data-p="${i}">${i+1}</button>`).join(" ");
$("#mx").innerHTML=CH.map((n,i)=>`<div class="mx"><span>${n}</span><input type="range" min="0" max="1" step=".01" data-m="v" data-c="${i}" title="${t("vol")}"><input type="range" min="-1" max="1" step=".01" data-m="p" data-c="${i}" title="${t("pan")}"></div>`).join("");
$("#pls").innerHTML=S.song.map((_,i)=>`<div class="mx"><span>#${i+1}</span><select data-sl="${i}" style="grid-column:2/4"><option value="-1">—</option>${[0,1,2,3].map(p=>`<option value="${p}">${t("pat")} ${p+1}</option>`).join("")}</select></div>`).join("")}
function sync(){$("#bpm").value=S.bpm;$("#md").textContent=S.mode==="song"?t("song"):t("pat");$("#mv").value=S.mv;
document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("on",+b.dataset.p===S.cur));
document.querySelectorAll("[data-m]").forEach(i=>i.value=S.mix[+i.dataset.c][i.dataset.m]);
document.querySelectorAll("[data-sl]").forEach(s=>s.value=S.song[+s.dataset.sl]);applyMix();rack();drawPR()}
$("#pl").onclick=toggle;$("#md").onclick=()=>{S.mode=S.mode==="song"?"pat":"song";sync()};
$("#pb").onclick=e=>{if(e.target.dataset.p!==undefined){S.cur=+e.target.dataset.p;sync()}};
$("#bpm").onchange=e=>{const v=parseFloat(e.target.value);S.bpm=Number.isFinite(v)?Math.min(300,Math.max(40,v)):120;e.target.value=S.bpm};
$("#mv").oninput=e=>{S.mv=+e.target.value;applyMix()};
$("#mx").oninput=e=>{const t=e.target;if(t.dataset.m){S.mix[+t.dataset.c][t.dataset.m]=+t.value;applyMix()}};
$("#mx").ondblclick=e=>{const t=e.target;if(t.dataset.m==="p"){t.value=0;S.mix[+t.dataset.c].p=0;applyMix()}};
$("#pls").onchange=e=>{if(e.target.dataset.sl!==undefined){snap();S.song[+e.target.dataset.sl]=+e.target.value}};
$("#cl").onclick=()=>{snap();S.pats[S.cur]=mk();sync();st(t("cleared"))};
/* ---- proje ---- */
function dl(b,n,ty){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b],{type:ty}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)}
$("#bs").onclick=()=>{dl(JSON.stringify(S),"project.l4w.json","application/json");st(t("saved"))};
$("#bo").onclick=()=>$("#fi").click();
const num=(x,a,b)=>typeof x==="number"&&x>=a&&x<=b;
function valid(d){return d&&num(d.bpm,40,300)&&num(d.cur,0,3)&&num(d.mv,0,1)&&(d.mode==="pat"||d.mode==="song")&&Array.isArray(d.pats)&&d.pats.length===4&&
d.pats.every(p=>p&&Array.isArray(p.s)&&p.s.length===5&&p.s.every(r=>Array.isArray(r)&&r.length===NW)&&Array.isArray(p.n)&&p.n.every(n=>n&&num(n.s,0,NW-1)&&num(n.l,1,NW)&&num(n.k,LO,HI)))&&
Array.isArray(d.song)&&d.song.length===8&&d.song.every(x=>num(x,-1,3))&&Array.isArray(d.mix)&&d.mix.length===6&&d.mix.every(m=>m&&num(m.v,0,1)&&num(m.p,-1,1))}
async function loadF(f){try{if(f.size>2e6)throw 0;const d=JSON.parse(await f.text());if(!valid(d))throw 0;d.mix.forEach(m=>m.m=m.m?1:0);snap();S=d;sync();st(t("opened")+": "+f.name)}catch(x){st(t("bad"))}}
$("#fi").onchange=e=>{const f=e.target.files[0];e.target.value="";f&&loadF(f)};
addEventListener("dragover",e=>e.preventDefault());addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer.files[0];f&&loadF(f)});
addEventListener("keydown",e=>{if(e.ctrlKey&&"zyZ".includes(e.key)&&!(e.target.tagName==="INPUT"&&e.target.type==="number")){e.preventDefault();e.key==="y"||e.shiftKey?redo():undo();return}
if(e.ctrlKey&&e.key==="s"){e.preventDefault();$("#bs").click();return}if(e.ctrlKey&&e.key==="o"){e.preventDefault();$("#bo").click();return}
if(e.code==="Space"&&!(e.target.tagName==="INPUT"&&e.target.type==="number")&&e.target.tagName!=="SELECT"){e.preventDefault();toggle()}});
addEventListener("keyup",e=>{if(e.code==="Space"&&e.target.tagName!=="SELECT")e.preventDefault()});
(function loop(){if(playing&&ctx){while(q.length&&q[0].t<=ctx.currentTime){const x=q.shift();if(x.s!==cs||x.p!==pp){cs=x.s;hl();drawPR()}}}
if(an){const a=new Uint8Array(an.fftSize);an.getByteTimeDomainData(a);let m=0;for(const v of a)m=Math.max(m,Math.abs(v-128));$("#mt i").style.width=Math.min(100,m/128*100)+"%"}
requestAnimationFrame(loop)})();
addEventListener("error",e=>st(t("err")+": "+e.message));
if(window.winctl){document.documentElement.classList.add("app");$(".tl").onclick=e=>{const w=e.target.dataset.w;if(w)winctl.send(w)};
$("header").ondblclick=e=>{if(e.target===e.currentTarget||e.target.closest("b"))winctl.send("max")}}
/* ---- geri al, otomatik kayıt, WAV ---- */
let hist=[],fut=[],restored=false,lastA="";
const snap=()=>{hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();fut=[]};
const undo=()=>{if(hist.length){fut.push(JSON.stringify(S));S=JSON.parse(hist.pop());sync()}},redo=()=>{if(fut.length){hist.push(JSON.stringify(S));S=JSON.parse(fut.pop());sync()}};
const auto=()=>{try{const j=JSON.stringify(S);if(j!==lastA){localStorage.setItem("l4w-auto",j);lastA=j}}catch(e){}};
setInterval(auto,3000);addEventListener("beforeunload",auto);
try{const d=JSON.parse(localStorage.getItem("l4w-auto"));if(valid(d)){d.mix.forEach(m=>m.m=m.m?1:0);S=d;lastA=JSON.stringify(S);restored=true}}catch(e){}
function enc(b){const n=b.length,d=new DataView(new ArrayBuffer(44+n*4)),w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0))),sr=b.sampleRate;
w(0,"RIFF");d.setUint32(4,36+n*4,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,2,true);d.setUint32(24,sr,true);d.setUint32(28,sr*4,true);d.setUint16(32,4,true);d.setUint16(34,16,true);w(36,"data");d.setUint32(40,n*4,true);
const L=b.getChannelData(0),R=b.getChannelData(1),f=x=>Math.max(-1,Math.min(1,x))*32767;for(let i=0;i<n;i++){d.setInt16(44+i*4,f(L[i]),true);d.setInt16(46+i*4,f(R[i]),true)}return d.buffer}
async function wav(){if(playing)stop();ensure();const sd=60/S.bpm/4,seq=S.mode==="song"?S.song.filter(p=>p>=0):[];if(!seq.length)seq.push(S.cur);
const sr=44100,live={ctx,mst,an,bus,nb};try{st(t("rend"));ctx=new OfflineAudioContext(2,Math.ceil((seq.length*NW*sd+2)*sr),sr);graph();let at=0;
seq.forEach(pi=>{const P=S.pats[pi];for(let s=0;s<NW;s++,at+=sd){for(let i=0;i<5;i++)if(P.s[i][s]&&!S.mix[i].m)V[i](at,bus[i].g);if(!S.mix[5].m)P.n.forEach(n=>{if(n.s===s)lead(n.k,at,n.l*sd)})}});
dl(enc(await ctx.startRendering()),"lived4w.wav","audio/wav");st(t("done"))}catch(e){st(t("fail"))}finally{({ctx,mst,an,bus,nb}=live)}}
$("#un").onclick=undo;$("#re").onclick=redo;$("#bw").onclick=wav;
/* ---- tema (Material 3) ve dil ---- */
const TH={mint:[["#7cf5b0","#08140e","#0e0f11","#16181b","#2a2d33","#d7dae0","#7d8490","#0a0b0c"],["#0a7d4b","#ffffff","#eceef1","#fafbfc","#cfd3da","#1c1f24","#6a717c","#dfe2e7"]],"purple":[["#cdc0ec","#443a5f","#0f0d12","#1b181f","#4a4650","#eae3ef","#aea9b4","#000000"],["#655789","#fdf7ff","#fdf7fe","#f2ecf5","#b5b0bb","#34313a","#615d68","#ffffff"]],"blue":[["#b9c6ee","#333f61","#0d0e12","#181920","#454850","#e4e5f0","#a9aab5","#000000"],["#4d5e8b","#f9f8ff","#faf8fe","#ededf6","#b0b1bc","#30323b","#5d5f68","#ffffff"]],"green":[["#b3cfa1","#304624","#0c0f0a","#171b14","#444a3f","#e2e7d9","#a7ada0","#000000"],["#486738","#ecffdc","#f9faf1","#ecefe3","#aeb4a6","#2f342a","#5b6155","#ffffff"]],"teal":[["#9bd0cf","#0c4848","#0a0f0f","#131b1b","#3f4a4a","#dce8e7","#a2adad","#000000"],["#1b6969","#e0fffe","#f6faf9","#e7f0ef","#a9b4b3","#2a3434","#566161","#ffffff"]],"red":[["#f9b6ad","#61332e","#130d0c","#221716","#554442","#f9e0dc","#bca6a3","#000000"],["#8c4e46","#fff7f6","#fff8f7","#fee9e6","#c3adaa","#3e2f2d","#6d5b58","#ffffff"]],"amber":[["#f0bd8d","#5a3914","#130d08","#201811","#52463a","#f6e2d2","#baa89a","#000000"],["#835523","#fff7f4","#fff8f5","#fcebde","#c1afa0","#3c3026","#6b5c50","#ffffff"]]};
